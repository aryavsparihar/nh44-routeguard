name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web app (audit, lint, typecheck, test, build, bundle check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Known vulnerabilities: high or critical anywhere fails; for the
      # packages that ship in the app (not dev tools), moderate already fails.
      - name: npm audit (all dependencies, high and up)
        run: npm audit --audit-level=high

      - name: npm audit (production dependencies, moderate and up)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Every env var the app reads is in .env.example
        run: bash scripts/ci/check-env-example.sh

      - name: No dangerouslySetInnerHTML
        run: bash scripts/ci/check-no-inner-html.sh

      - name: No raw SQL outside src/server/db
        run: bash scripts/ci/check-no-sql-raw.sh

      - name: Translations match (en, hi, ur)
        run: npm run i18n:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and API tests (Vitest, with coverage)
        run: npm test -- --coverage

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # No env vars here on purpose: the app must build without any keys.
      - name: Build
        run: npm run build

      - name: No secret keys in the browser bundle or prerendered pages
        run: bash scripts/ci/check-bundle-secrets.sh

  # Builds the same image the deploy workflow ships (without keys), starts
  # it, and runs the post-deploy smoke test against it. Proves the
  # Dockerfile on every PR before it ever reaches Azure.
  docker:
    name: Docker image (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Build the image (no keys)
        run: docker build -t routeguard:ci .

      - name: Start it
        run: docker run -d --name app -p 3000:3000 routeguard:ci

      - name: Wait until it answers
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health > /dev/null && exit 0
            sleep 1
          done
          docker logs app
          exit 1

      # No database in CI, so /ready may answer 503; that is allowed here.
      - name: Smoke test
        run: node scripts/smoke.mjs http://localhost:3000

      # The Postman collection's keyless folders: public reads (200, or 503
      # without a database), and 400/401/403/404/405/415/422 answers. The
      # signed-in and rate-limit folders need real keys and run locally
      # (postman/README.md).
      - name: API tests (newman)
        run: >
          npx -y newman@6.2.3 run postman/RouteGuard.postman_collection.json
          -e postman/ci.postman_environment.json
          --folder "1 Public" --folder "2 Errors without signing in"
          --reporters cli

      # Phone-sized browser tests against the same container. Tests that need
      # the database skip themselves here (E2E_DB unset).
      - name: Install dependencies (for Playwright)
        run: npm ci

      - name: Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Mobile end-to-end tests (Playwright)
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run e2e

      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: No .env files or secret keys in the image
        run: |
          docker cp app:/app ./image-app
          if find image-app -name '.env*' | grep .; then
            echo "An .env file got into the image. Check .dockerignore."
            exit 1
          fi
          bash scripts/ci/check-bundle-secrets.sh image-app

      - name: Server log (on failure)
        if: failure()
        run: docker logs app || true

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The action lists the PR's commits through the GitHub API, which needs
    # pull-requests: read. Job permissions replace the top-level ones, so
    # contents: read is repeated here.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks needs the commits, not just the latest files

      # Personal-account repos need no GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments on the PR would need write access. A red check is enough.
          GITLEAKS_ENABLE_COMMENTS: false

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt

      - name: Install dependencies
        run: pip install -r jobs/requirements.txt

      - name: Run tests (fake weather, no network, no keys)
        run: python -m pytest jobs/tests -q

      - name: Validate incidents.csv (section 14)
        run: python scripts/validate_incidents.py
