name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt

      - name: Install dependencies
        run: pip install -r jobs/requirements.txt

      - name: Run tests (fake weather, no network, no keys)
        run: python -m pytest jobs/tests -q
